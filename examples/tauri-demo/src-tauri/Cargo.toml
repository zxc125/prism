[package]
name = "tauri-demo"
version = "0.1.0"
description = "P5 验证样例：外部 Tauri 应用装 tauri-plugin-observer（Remote 模式）"
edition = "2021"

[lib]
name = "tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-observer = { path = "../../../plugins/tauri-plugin-observer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
