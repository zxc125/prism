<svg viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 深空底（favicon 在浅色 tab 仍可辨） -->
  <rect width="64" height="64" rx="13" fill="#0A0C10" />
  <!-- 菱镜玻璃面 -->
  <polygon points="16,32 32,14 48,32 32,50" fill="rgba(230,234,240,0.05)" stroke="rgba(230,234,240,0.4)" stroke-width="1.3" stroke-linejoin="round" />
  <!-- 白光入射 -> 中心 -->
  <line x1="4" y1="32" x2="32" y2="32" stroke="#E6EAF0" stroke-width="2.8" stroke-linecap="round" />
  <!-- 琥珀出射（中心 -> 右上） -->
  <line x1="32" y1="32" x2="60" y2="16" stroke="#F0A83D" stroke-width="2.8" stroke-linecap="round" />
  <!-- 冷青出射（中心 -> 右下） -->
  <line x1="32" y1="32" x2="60" y2="48" stroke="#4DD0C8" stroke-width="2.8" stroke-linecap="round" />
  <!-- 折射节点 -->
  <circle cx="32" cy="32" r="2.8" fill="#E6EAF0" />
</svg>
